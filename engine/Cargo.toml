[package]
name = "engine"
version.workspace = true
edition = "2021"

[features]
cuda = ["face_detection/cuda", "optical_flow/cuda"]
migraphx = ["face_detection/migraphx", "optical_flow/migraphx"]
webgpu = ["face_detection/webgpu", "optical_flow/webgpu"]
directml = ["face_detection/directml", "optical_flow/directml"]
openvino = ["face_detection/openvino", "optical_flow/openvino"]

[dependencies]
rayon = "1.10.0"
num-complex = "0.4.6"
rustfft = "6.2.0"
image = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
rand_chacha = "0.9"
serde_json = { workspace = true }
face_detection = { path = "../face_detection" }
optical_flow = { path = "../optical_flow" }
onnx = { path = "../onnx" }
video-processor = { path = "../video-processor" }
