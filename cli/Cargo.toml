[package]
name = "scramblery-cli"
version.workspace = true
description = "Command-line interface to Scramblery"
license = "GPL-3.0-only"
edition = "2021"

[[bin]]
name = "scramblery-cli"
path = "src/main.rs"

[features]
cuda = ["engine/cuda"]
migraphx = ["engine/migraphx"]
webgpu = ["engine/webgpu"]
directml = ["engine/directml"]

[dependencies]
engine = { path = "../engine" }
anyhow = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
