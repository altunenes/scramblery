name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            features: ''
          - platform: macos-latest
            features: 'webgpu'

          - platform: windows-latest
            features: ''
          - platform: windows-latest
            features: 'cuda'
          - platform: windows-latest
            features: 'webgpu'
          - platform: windows-latest
            features: 'directml'
          - platform: windows-latest
            features: 'openvino'

          # CPU-only Linux build
          - platform: ubuntu-24.04
            features: ''
          # GPU builds require ubuntu-24.04: ORT CUDA binaries need glibc 2.38+
          - platform: ubuntu-24.04
            features: 'cuda'
          - platform: ubuntu-24.04
            features: 'webgpu'
          - platform: ubuntu-24.04
            features: 'migraphx'
          - platform: ubuntu-24.04
            features: 'openvino'
    runs-on: ${{ matrix.platform }}
    env:
      GSTREAMER_MACOS: '1.28.6'
      APP_NAME: ${{ matrix.features != '' && format('scramblery-{0}', matrix.features) || 'scramblery' }}
      FEATURES: ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # Linux dependencies
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            build-essential \
            patchelf \
            libfuse2t64 \
            libunwind-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly

      # macOS dependencies and Gatekeeper workaround
      # gstreamer.freedesktop.org is often slow or unavailable, so the packages are downloaded once and cached.
      - name: Cache GStreamer packages
        if: matrix.platform == 'macos-latest'
        uses: actions/cache@v4
        with:
          path: gst-pkgs
          key: macos-gstreamer-${{ env.GSTREAMER_MACOS }}

      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          GSTREAMER_VERSION="$GSTREAMER_MACOS"
          mkdir -p gst-pkgs
          for f in "gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" "gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg"; do
            [ -s "gst-pkgs/$f" ] && continue
            # The server often closes the connection mid-transfer, so each attempt resumes the partial file.
            n=0
            until curl -fL --http1.1 -C - "https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION/$f" -o "gst-pkgs/$f.part"; do
              n=$((n+1))
              [ "$n" -ge 40 ] && { echo "Download of $f failed"; exit 1; }
              sleep 15
            done
            mv "gst-pkgs/$f.part" "gst-pkgs/$f"
          done
          cp "gst-pkgs/gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" gstreamer.pkg
          cp "gst-pkgs/gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg" gstreamer-devel.pkg

          sudo installer -pkg gstreamer.pkg -target /
          sudo installer -pkg gstreamer-devel.pkg -target /

          # Set environment variables for later steps
          echo "PKG_CONFIG_PATH=/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig" >> $GITHUB_ENV
          echo "GST_PLUGIN_PATH=/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/gstreamer-1.0" >> $GITHUB_ENV

          sudo spctl --master-disable || true

      - name: Install Windows dependencies
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "Starting GStreamer installation process..."
          $gstVer = "1.28.6"
          $tempDir = "C:\gst-temp"
          $installDir = "C:\gstreamer"

          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null

          $installerUrl = "https://github.com/altunenes/cuneus/releases/download/dependencies/gstreamer-1.0-msvc-x86_64-$gstVer.exe"
          Write-Host "Downloading GStreamer $gstVer installer..."
          Invoke-WebRequest -Uri $installerUrl -OutFile "$tempDir\gstreamer.exe"

          # Inno Setup silent flags (GStreamer 1.28.0 switched from NSIS/MSI to Inno Setup)
          Write-Host "Installing GStreamer..."
          $proc = Start-Process -FilePath "$tempDir\gstreamer.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Host "Installation failed with exit code: $($proc.ExitCode)"; exit 1
          }

          Write-Host "Searching for GStreamer installation..."
          # Dump directory tree to find where Inno Setup actually installed
          Write-Host "=== Contents of C:\ ==="
          Get-ChildItem "C:\" | Select-Object Name | Format-Table
          if (Test-Path $installDir) {
            Write-Host "=== Contents of $installDir (3 levels) ==="
            Get-ChildItem $installDir -Recurse -Depth 3 | Select-Object FullName | Format-Table
          }
          Write-Host "=== Checking Program Files ==="
          Get-ChildItem "C:\Program Files" | Where-Object { $_.Name -like "*gstreamer*" -or $_.Name -like "*GStreamer*" } | Format-Table

          # Try known possible paths
          $possiblePaths = @(
            "$installDir\1.0\msvc_x86_64",
            "$installDir\msvc_x86_64",
            $installDir,
            "C:\Program Files\GStreamer\1.0\msvc_x86_64",
            "C:\Program Files (x86)\GStreamer\1.0\msvc_x86_64"
          )
          $expectedPath = $null
          foreach ($p in $possiblePaths) {
            if (Test-Path "$p\bin") {
              Write-Host "Found GStreamer at: $p"
              $expectedPath = $p
              break
            }
          }
          if ($null -eq $expectedPath) {
            Write-Host "ERROR: Could not find GStreamer installation"
            exit 1
          }

          # Verify core GStreamer DLL is present
          $dllToCheck = "bin\gstreamer-1.0-0.dll"
          $fullDllPath = Join-Path $expectedPath $dllToCheck
          if (Test-Path $fullDllPath) {
            Write-Host "Found: $dllToCheck"
          } else {
            Write-Host "Missing critical file: $dllToCheck in $expectedPath"
            Get-ChildItem -Path $expectedPath -Recurse | Format-List
            exit 1
          }
          
          Write-Host "Setting environment variables..."
          $env:GSTREAMER_1_0_ROOT_MSVC_X86_64 = $expectedPath
          $env:GST_PLUGIN_PATH = "$expectedPath\lib\gstreamer-1.0"
          $env:PKG_CONFIG_PATH = "$expectedPath\lib\pkgconfig"
          $env:Path = "$expectedPath\bin;" + $env:Path
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$expectedPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GST_PLUGIN_PATH=$expectedPath\lib\gstreamer-1.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$expectedPath\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$expectedPath\bin;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          Write-Host "GStreamer installation completed successfully."

      - name: Build the app
        shell: bash
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
        run: cargo build --release -p scramblery $FEATURES


      - name: Bundle ONNX Runtime provider libraries
        if: matrix.features != '' && matrix.platform != 'macos-latest'
        shell: bash
        run: |
          mkdir -p app/ort-libs
          for f in target/release/*.dll target/release/*.so target/release/*.so.*; do
            [ -e "$f" ] && cp -L "$f" app/ort-libs/
          done
          ls -la app/ort-libs
          if [ -z "$(ls -A app/ort-libs)" ]; then
            echo "::warning::No provider libraries found in target/release"
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            # NSIS installs resources next to the executable.
            sed -i.bak -e '/^resources = \[/s/\]$/, "ort-libs\/*"]/' app/Cargo.toml
          else
            # The .deb installs the executable to /usr/bin.
            printf '\n[package.metadata.packager.deb]\nfiles = { "ort-libs" = "usr/bin" }\n' >> app/Cargo.toml
          fi

      - name: Configure package for this variant
        shell: bash
        run: |
          sed -i.bak -e "s/^product-name = \"scramblery\"/product-name = \"$APP_NAME\"/" app/Cargo.toml
          if [ "${{ matrix.platform }}" = "macos-latest" ] && [ "${{ matrix.features }}" = "webgpu" ]; then
            printf '\n[package.metadata.packager.macos]\nframeworks = ["webgpu-dylibs/libwebgpu_dawn.dylib"]\n' >> app/Cargo.toml
          fi
          sed -n '/package.metadata.packager/,$p' app/Cargo.toml

      - name: Package (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        working-directory: app
        run: cargo packager --release --formats nsis

      - name: Package (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        working-directory: app
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: cargo packager --release --formats deb,appimage

      - name: Package (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: app
        run: |
          cargo packager --release --formats app
          APP_PATH="../target/packages/${APP_NAME}.app"
          echo "Signing app at $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH" && echo "Signature OK"

          # The disk image holds the app and a link to /Applications to drag it onto.
          STAGE="../target/packages/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          VERSION=${GITHUB_REF_NAME#v}
          hdiutil create -volname "Scramblery" -srcfolder "$STAGE" -ov -format UDZO "../target/packages/${APP_NAME}_${VERSION}_aarch64.dmg"

      - name: Name installers after the variant
        if: matrix.features != '' && matrix.platform != 'macos-latest'
        shell: bash
        working-directory: target/packages
        run: |
          for f in scramblery_*-setup.exe scramblery_*.deb scramblery_*.AppImage; do
            [ -e "$f" ] && mv "$f" "${APP_NAME}_${f#scramblery_}"
          done
          ls -la

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Scramblery ${{ github.ref_name }}'
          body_path: .github/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            target/packages/*.dmg
            target/packages/*-setup.exe
            target/packages/*.deb
            target/packages/*.AppImage
