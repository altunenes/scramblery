[package]
name = "onnx"
version = "0.1.0"
edition = "2021"

[features]
cuda = ["ort/cuda"]
migraphx = ["ort/migraphx"]
webgpu = ["ort/webgpu"]
directml = ["ort/directml"]
openvino = ["ort/openvino"]

[dependencies]
ort = { version = "=2.0.0-rc.15" }
# for ort logs
tracing = { version = "0.1", features = ["log"] }
once_cell = "1.20.3"
anyhow = { workspace = true }
log = {workspace = true}

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["coreml"] }